<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Predict Disease - GreenGuard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#eaf3de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13 11 11"/></svg>
      </div>
      <div>
        <div class="brand-text-main">GreenGuard</div>
        <div class="brand-text-sub">Smart Tree Health Monitoring</div>
      </div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="/profile">Profile</a>
      <a class="nav-item" href="/dashboard">Dashboard</a>
      <a class="nav-item active" href="/upload">Predict Disease</a>
      <a class="nav-item" href="/history">History</a>
      <a class="nav-item" href="/logout">Logout</a>
    </nav>

    <div class="side-quote">
      <p>Take care of trees,<br>they will take care of us.</p>
    </div>
  </aside>

  <main class="main">
    <div class="upload-hero">
      <h1>Detect Tree Diseases Instantly</h1>
      <p>Upload a clear image of the leaf to get AI-powered disease detection and expert recommendations.</p>
    </div>

    <div class="upload-card">
      <form method="POST" action="/predict" enctype="multipart/form-data" id="uploadForm">
        <label for="fileInput" class="dropzone-big" id="dropzone">
          <svg class="dropzone-icon" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#7A8A7E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block; margin:0 auto 12px;"><path d="M7 18a4.5 4.5 0 0 1-1.13-8.86A5.5 5.5 0 0 1 16.5 7a4.5 4.5 0 0 1 1.5 8.74"/><path d="M12 12v9M9 15l3-3 3 3"/></svg>
          <p><strong>Drag & drop your leaf image here</strong></p>
          <p class="dropzone-sub">or click to browse</p>
          <p class="dropzone-sub">JPG, JPEG, PNG (Max 5MB)</p>
          <input type="file" name="leaf_image" id="fileInput" accept="image/*" required hidden>
        </label>

        <button type="button" class="scan-btn" id="scanBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7V5a1 1 0 011-1h2M4 17v2a1 1 0 001 1h2M20 7V5a1 1 0 00-1-1h-2M20 17v2a1 1 0 01-1 1h-2"/><circle cx="12" cy="12" r="3.5"/></svg>
          Scan with Camera
        </button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

        <p id="fileName" class="filename-preview"></p>
        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; margin-top:6px;">Analyze Leaf</button>
      </form>
    </div>
  </main>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>Analyzing your leaf...</p>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const cameraInput = document.getElementById('cameraInput');
  const scanBtn = document.getElementById('scanBtn');
  const dropzone = document.getElementById('dropzone');
  const fileName = document.getElementById('fileName');
  const uploadForm = document.getElementById('uploadForm');
  const loadingOverlay = document.getElementById('loadingOverlay');

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      fileName.textContent = "Selected: " + fileInput.files[0].name;
    }
  });

  scanBtn.addEventListener('click', () => {
    cameraInput.click();
  });

  cameraInput.addEventListener('change', () => {
    if (cameraInput.files.length > 0) {
      fileInput.files = cameraInput.files;
      fileName.textContent = "Scanned: " + cameraInput.files[0].name;
    }
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    fileInput.files = e.dataTransfer.files;
    if (fileInput.files.length > 0) {
      fileName.textContent = "Selected: " + fileInput.files[0].name;
    }
  });

  uploadForm.addEventListener('submit', () => {
    loadingOverlay.classList.add('active');
  });
</script>
</body>
</html>
