<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - GreenGuard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-side">
    <div class="auth-side-content">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#eaf3de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13 11 11"/></svg>
        </div>
        <div class="auth-brand-text">GreenGuard</div>
      </div>
      <h2>Join GreenGuard Today</h2>
      <p>Create an account to start detecting tree diseases instantly with AI and keep your trees healthy.</p>
    </div>
    <svg class="auth-deco" viewBox="0 0 24 24" width="220" height="220" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 11 13 11 11"/></svg>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1>Create Account</h1>
      <p class="auth-sub">Join GreenGuard today</p>

      <form method="POST" action="/signup">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn-primary auth-submit">Sign Up</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>
</div>
</body>
</html>
