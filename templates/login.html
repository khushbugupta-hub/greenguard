<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - GreenGuard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-side">
    <div class="auth-side-content">
      <div class="auth-brand">
        <div class="auth-brand-icon">🌿</div>
        <div class="auth-brand-text">GreenGuard</div>
      </div>
      <h2>Welcome Back</h2>
      <p>Monitor tree health, detect diseases early, and get AI-powered recommendations to keep your trees thriving.</p>
    </div>
    <div class="auth-deco">🌿</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1>Login</h1>
      <p class="auth-sub">Login to continue to your dashboard</p>

      <form method="POST" action="/login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-primary auth-submit">Login</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>
</div>
</body>
</html>
